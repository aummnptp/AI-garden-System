version: '3.8'

networks:
  ai_garden_network:
    driver: bridge
services:

  nest-backend:
    build:
      context: ./nest-backend
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - uploads-data:/app/uploads
      - ./nest-backend/.env:/app/.env
    environment:
      DATABASE_URL: postgres://postgres:admin@host.docker.internal:5432/ai_garden_db
      NODE_ENV: development
    networks:
      - ai_garden_network
    extra_hosts:
      - "host.docker.internal:host-gateway"

  react-frontend:
      build:
        context: ./ReactFrontend
        dockerfile: Dockerfile.dev
      restart: unless-stopped
      ports:
        - "5173:5173"
      networks:
        - ai_garden_network
      depends_on:
      - nest-backend
      volumes:
      - ./ReactFrontend:/app

volumes:
  db-data:
  uploads-data: