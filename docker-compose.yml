version: '3.8'

networks:
  ai_garden_network:
    driver: bridge
services:
  # Database Service
  db:
    image: postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: ai_garden_db
    networks:
      - ai_garden_network
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend Service (NestJS)
  nest-backend:
    build:
      context: ./nest-backend
    restart: always
    ports:
      - "3000:3000" # พอร์ต Backend
    volumes:
      - ./nest-backend/uploads:/app/uploads # Map โฟลเดอร์ uploads
      - ./nest-backend/.env:/app/.env # 
    environment:
      DATABASE_URL: postgres://postgres:admin@db:5432/ai_garden_db
      NODE_ENV: development
    networks:
      - ai_garden_network
    depends_on:
      db:
        condition: service_healthy

  # Frontend Service (React)
  react-frontend:
    build:
      context: ./ReactFrontend
    ports:
      - "3001:5173"
    stdin_open: true
    tty: true

    volumes:
      - ./ReactFrontend:/app
      - /app/node_modules
    environment:
      REACT_APP_API_URL: http://localhost:3000
    networks:
      - ai_garden_network
    command: npm run dev -- --host


volumes:
  db-data: