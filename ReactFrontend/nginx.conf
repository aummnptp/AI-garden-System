events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    server {
        listen 80;
        server_name localhost;

        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        # กำหนด MIME Type ให้ถูกต้องสำหรับ JavaScript และ CSS
        location ~* \.js$ {
            root /usr/share/nginx/html;
            types { application/javascript js; }
            add_header Content-Type application/javascript;
        }

        location ~* \.css$ {
            root /usr/share/nginx/html;
            types { text/css css; }
            add_header Content-Type text/css;
        }

        # ตั้งค่าการแคชไฟล์ static เพื่อลดการโหลดซ้ำ
        location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|otf|svg|mp4|webm|ogg|mp3|wav|flac|aac|zip|gz|bz2|tar|rar|7z|xml|json)$ {
            expires 6M;
            access_log off;
            add_header Cache-Control "public, max-age=15552000, immutable";
        }

        # ป้องกันการเข้าถึงไฟล์ที่ไม่ควรให้ใช้งานโดยตรง
        location ~ /\. {
            deny all;
        }
    }
}
