version: '3.8'

networks:
  ai_garden_network:
    driver: bridge
    external: true

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: ai_garden_db
    networks:
      - ai_garden_network
    ports:
      - 5432
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  nest-backend:
    build:
      context: ./nest-backend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    ports:
      - 3000
    volumes:
      - uploads-data:/app/uploads
      - ./nest-backend/.env:/app/.env
    environment:
      DATABASE_URL: postgres://postgres:admin@db:5432/ai_garden_db
      NODE_ENV: production
    networks:
      - ai_garden_network
    depends_on:
      db:
        condition: service_healthy

  react-frontend:
    build:
      context: ./ReactFrontend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    ports:
      - 80
      - 443
    networks:
      - ai_garden_network
    depends_on:
      - nest-backend
    volumes:
      - ./ReactFrontend/nginx.prod.conf:/etc/nginx/nginx.conf

volumes:
  db-data:
  uploads-data: